spec:
  template:
    spec:
      containers:
      - name: sre-api
        env:
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-client
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-client
              key: password
        - name: RABBITMQ_HOST
          value: rabbitmq.rabbitmq.svc.cluster.local
